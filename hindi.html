<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="" UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="./page2.css">
</head>

<body>
    <div class="newspaper-grid">
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/times.png" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Times Of India</h2>
                <button onclick="window.open('https://www.timesofindia.indiatimes.com/', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/hindu.png" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Hindu</h2>
                <button onclick="window.location.href='https://www.thehindu.com/'">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/hindustan.jpg" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Hindustan Times</h2>

                <button onclick="window.open('https://www.hindustantimes.com/', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/indian.png" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Indian Express</h2>

                <button onclick="window.open('https://www.indianexpress.com/', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/telegraphindia.png" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Telegraph India </h2>

                <button onclick="window.open('https://www.telegraphindia.com/news', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/economic.jpg" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Economic Times</h2>

                <button onclick="window.open('https://www.economictimes.indiatimes.com/', '_blank')">Read More</button>
            </div>
        </div>
        <p class="ending">More Publications Coming Soon...</p>
</body>
