<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="" UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="./page2.css">
</head>

<body>
    <div class="newspaper-grid">
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/newyork.png" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>New York Times</h2>
                <button onclick="window.open('https://www.nytimes.com/', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/guardian.jpg" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Guardian</h2>
                <button onclick="window.location.href='https://www.theguardian.com/'">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/washington.jpg" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Washington Post</h2>

                <button onclick="window.open('https://www.washingtonpost.com/', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/wall2.jpg" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Wall Street Journal</h2>

                <button onclick="window.open('https://www.wsj.com/', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/bbc.jpg" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>BBC News</h2>

                <button onclick="window.open('https://www.bbc.com/news', '_blank')">Read More</button>
            </div>
        </div>
        <div class="newspaper-card">
            <div class="newspaper-image">
                <img src="./assets/telegraph.png" alt="Newspaper">
            </div>
            <div class="newspaper-info">
                <h2>The Telegraph</h2>

                <button onclick="window.open('https://www.telegraph.co.uk/', '_blank')">Read More</button>
            </div>
        </div>
     <p class="ending">More Publications Coming Soon...</p>
</body>
